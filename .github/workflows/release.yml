name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            cross_arm64: false
          - os: ubuntu-24.04
            target: aarch64-unknown-linux-gnu
            cross_arm64: true
          - os: macos-latest
            target: aarch64-apple-darwin
            cross_arm64: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install ARM64 Linux cross-compiler
        if: matrix.cross_arm64
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Build & package release archive
        env:
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          set -euo pipefail
          VER="${GITHUB_REF_NAME#v}"
          ARCHIVE="carnot-${VER}-${{ matrix.target }}.tar.gz"
          cargo build --release --target ${{ matrix.target }} --bin carnot --features all-ext
          mkdir -p staging
          cp "target/${{ matrix.target }}/release/carnot" staging/carnot
          chmod 0755 staging/carnot
          tar -C staging -czf "${ARCHIVE}" carnot
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.target }}
          path: carnot-*.tar.gz

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum carnot-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
