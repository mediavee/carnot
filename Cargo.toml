[workspace]
resolver = "3"
members = [
    "crates/carnot-core",
    "crates/carnot-cas",
    "crates/carnot-sandbox",
    "crates/carnot-session",
    "crates/carnot-ai",
    "crates/carnot-tools",
    "crates/carnot-mcp",
    "crates/carnot-ext",
    "crates/carnot-agent",
    "crates/carnot-protocol",
    "crates/carnot",
    "crates/carnot-tui",
    "crates/carnot-cli",
    "extensions/carnot-ext-web",
    "extensions/carnot-ext-lsp",
    "extensions/carnot-ext-subagent",
    "extensions/carnot-ext-hooks",
    "extensions/carnot-ext-claude-plugins",
    "extensions/carnot-ext-memory",
    "extensions/carnot-ext-codemode",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mediavee/carnot"
description = "Fast, safe Rust coding-agent harness with prefix-invariant caching and fail-closed OS sandboxing"
keywords = ["ai", "agent", "llm", "cli", "coding-agent"]
categories = ["command-line-utilities", "development-tools"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
panic_in_result_fn = "warn"
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
rc_buffer = "warn"
string_add = "warn"
wildcard_imports = "warn"
dbg_macro = "warn"
todo = "warn"
format_push_string = "warn"
format_collect = "warn"
assigning_clones = "warn"
missing_assert_message = "warn"

# Calibrated pedantic exceptions (BeautifulRust defaults + practical noise filters).
module_name_repetitions = "allow"
must_use_candidate = "allow"
module_inception = "allow"
enum_glob_use = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"

[workspace.dependencies]
base64 = "0.23"
blake3 = "1"
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = { version = "0.29", default-features = false, features = ["bracketed-paste", "events", "windows"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
regex = "1.13"
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "http2", "gzip", "deflate", "brotli"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
similar = "3.2"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std", "net", "signal", "fs"] }
tokio-util = "0.7"
toml = { version = "1.2", default-features = false, features = ["parse", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tree-sitter = "0.27"
tree-sitter-go = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
unicode-width = "0.2"
url = "2.5"
uuid = { version = "1.29", features = ["v4", "v7", "serde"] }
webpki-root-certs = "1"

carnot-core = { version = "0.1.0", path = "crates/carnot-core" }
carnot-cas = { version = "0.1.0", path = "crates/carnot-cas" }
carnot-sandbox = { version = "0.1.0", path = "crates/carnot-sandbox" }
carnot-session = { version = "0.1.0", path = "crates/carnot-session" }
carnot-ai = { version = "0.1.0", path = "crates/carnot-ai" }
carnot-tools = { version = "0.1.0", path = "crates/carnot-tools" }
carnot-mcp = { version = "0.1.0", path = "crates/carnot-mcp" }
carnot-ext = { version = "0.1.0", path = "crates/carnot-ext" }
carnot-agent = { version = "0.1.0", path = "crates/carnot-agent" }
carnot-protocol = { version = "0.1.0", path = "crates/carnot-protocol" }
carnot = { version = "0.1.0", path = "crates/carnot" }
carnot-tui = { version = "0.1.0", path = "crates/carnot-tui" }
carnot-ext-web = { version = "0.1.0", path = "extensions/carnot-ext-web" }
carnot-ext-lsp = { version = "0.1.0", path = "extensions/carnot-ext-lsp" }
carnot-ext-subagent = { version = "0.1.0", path = "extensions/carnot-ext-subagent" }
carnot-ext-hooks = { version = "0.1.0", path = "extensions/carnot-ext-hooks" }
carnot-ext-claude-plugins = { version = "0.1.0", path = "extensions/carnot-ext-claude-plugins" }
carnot-ext-memory = { version = "0.1.0", path = "extensions/carnot-ext-memory" }
carnot-ext-codemode = { version = "0.1.0", path = "extensions/carnot-ext-codemode" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
