[package]
name = "carnot-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[[bin]]
name = "carnot"
path = "src/main.rs"

[features]
default = ["tui", "all-ext"]
tui = ["dep:carnot-tui"]
ext-web = ["carnot/ext-web"]
ext-lsp = ["carnot/ext-lsp"]
ext-subagent = ["carnot/ext-subagent"]
ext-hooks = ["carnot/ext-hooks"]
ext-claude-plugins = ["carnot/ext-claude-plugins"]
ext-memory = ["carnot/ext-memory"]
ext-codemode = ["carnot/ext-codemode"]
ext-goal = ["carnot/ext-goal"]
ext-adaptive = ["carnot/ext-adaptive"]
all-ext = [
    "ext-web",
    "ext-lsp",
    "ext-subagent",
    "ext-hooks",
    "ext-claude-plugins",
    "ext-memory",
    "ext-codemode",
    "ext-goal",
    "ext-adaptive",
]

[dependencies]
base64.workspace = true
carnot.workspace = true
carnot-ext.workspace = true
carnot-tools.workspace = true
carnot-tui = { workspace = true, optional = true }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
toml.workspace = true
tracing-subscriber.workspace = true
