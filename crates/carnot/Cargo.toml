[package]
name = "carnot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
readme = "../../README.md"

[lints]
workspace = true

[features]
default = []
ext-web = ["dep:carnot-ext-web"]
ext-lsp = ["dep:carnot-ext-lsp"]
ext-subagent = ["dep:carnot-ext-subagent"]
ext-hooks = ["dep:carnot-ext-hooks"]
ext-claude-plugins = ["dep:carnot-ext-claude-plugins", "ext-hooks"]
ext-memory = ["dep:carnot-ext-memory"]
ext-codemode = ["dep:carnot-ext-codemode"]
ext-goal = ["dep:carnot-ext-goal"]
ext-adaptive = ["dep:carnot-ext-adaptive"]
all-ext = [
    "ext-web",
    "ext-lsp",
    "ext-subagent",
    "ext-hooks",
    "ext-claude-plugins",
    "ext-memory",
    "ext-codemode",
    "ext-goal",
    "ext-adaptive",
]

[dependencies]
carnot-agent.workspace = true
carnot-ai.workspace = true
carnot-cas.workspace = true
carnot-core.workspace = true
carnot-ext.workspace = true
carnot-ext-adaptive = { workspace = true, optional = true }
carnot-ext-claude-plugins = { workspace = true, optional = true }
carnot-ext-codemode = { workspace = true, optional = true }
carnot-ext-goal = { workspace = true, optional = true }
carnot-ext-hooks = { workspace = true, optional = true }
carnot-ext-lsp = { workspace = true, optional = true }
carnot-ext-memory = { workspace = true, optional = true }
carnot-ext-subagent = { workspace = true, optional = true }
carnot-ext-web = { workspace = true, optional = true }
carnot-mcp.workspace = true
carnot-protocol.workspace = true
carnot-sandbox.workspace = true
carnot-session.workspace = true
carnot-tools.workspace = true
tokio.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio-util.workspace = true
uuid.workspace = true
