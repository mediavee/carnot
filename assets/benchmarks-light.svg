<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 272" width="760" height="272" role="img" aria-label="Carnot cold-start latency and peak RSS memory benchmarks">
  <defs>
    <linearGradient id="accent-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF7A36"/>
      <stop offset="100%" stop-color="#D93818"/>
    </linearGradient>
    <style>
      .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
      .title { fill: #1f2328; font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .sub { fill: #656d76; font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .lbl { fill: #57606a; font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .lbl-hi { fill: #1f2328; font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .val { fill: #57606a; font: 500 11.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .val-hi { fill: #D93818; font: 700 11.5px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
      .track { fill: #f6f8fa; }
      .bar { fill: #c9d1d9; }
      .divider { stroke: #d8dee4; stroke-width: 1; }
    </style>
  </defs>

  <rect class="card" x="0.5" y="0.5" width="759" height="271" rx="12"/>
  <line class="divider" x1="380" y1="18" x2="380" y2="254"/>

  <!-- Left panel: Cold Start (median ms, lower is better) -->
  <text class="title" x="24" y="34">Cold Start to First HTTP</text>
  <text class="sub" x="24" y="50">Median ms · lower is better (15 runs, arm64)</text>

  <text class="lbl-hi" x="24" y="84">Carnot</text>
  <rect class="track" x="116" y="72" width="186" height="16" rx="4"/>
  <rect fill="url(#accent-bar)" x="116" y="72" width="6" height="16" rx="3"/>
  <text class="val-hi" x="310" y="84">7.4 ms</text>

  <text class="lbl" x="24" y="118">Codex CLI</text>
  <rect class="track" x="116" y="106" width="186" height="16" rx="4"/>
  <rect class="bar" x="116" y="106" width="14" height="16" rx="4"/>
  <text class="val" x="310" y="118">41.4 ms</text>

  <text class="lbl" x="24" y="152">Claude Code</text>
  <rect class="track" x="116" y="140" width="186" height="16" rx="4"/>
  <rect class="bar" x="116" y="140" width="85" height="16" rx="4"/>
  <text class="val" x="310" y="152">249.9 ms</text>

  <text class="lbl" x="24" y="186">Pi (Node)</text>
  <rect class="track" x="116" y="174" width="186" height="16" rx="4"/>
  <rect class="bar" x="116" y="174" width="158" height="16" rx="4"/>
  <text class="val" x="310" y="186">462.5 ms</text>

  <text class="lbl" x="24" y="220">OpenCode</text>
  <rect class="track" x="116" y="208" width="186" height="16" rx="4"/>
  <rect class="bar" x="116" y="208" width="186" height="16" rx="4"/>
  <text class="val" x="310" y="220">545.9 ms</text>

  <text class="sub" x="24" y="252">34× faster startup than Claude Code · 74× faster than OpenCode</text>

  <!-- Right panel: Peak RSS Memory (MiB, lower is better) -->
  <text class="title" x="404" y="34">Peak Memory Footprint (RSS)</text>
  <text class="sub" x="404" y="50">MiB · lower is better</text>

  <text class="lbl-hi" x="404" y="84">Carnot</text>
  <rect class="track" x="496" y="72" width="176" height="16" rx="4"/>
  <rect fill="url(#accent-bar)" x="496" y="72" width="6" height="16" rx="3"/>
  <text class="val-hi" x="680" y="84">10.3 MiB</text>

  <text class="lbl" x="404" y="118">Codex CLI</text>
  <rect class="track" x="496" y="106" width="176" height="16" rx="4"/>
  <rect class="bar" x="496" y="106" width="45" height="16" rx="4"/>
  <text class="val" x="680" y="118">133.7 MiB</text>

  <text class="lbl" x="404" y="152">Pi (Node)</text>
  <rect class="track" x="496" y="140" width="176" height="16" rx="4"/>
  <rect class="bar" x="496" y="140" width="53" height="16" rx="4"/>
  <text class="val" x="680" y="152">159.4 MiB</text>

  <text class="lbl" x="404" y="186">Claude Code</text>
  <rect class="track" x="496" y="174" width="176" height="16" rx="4"/>
  <rect class="bar" x="496" y="174" width="72" height="16" rx="4"/>
  <text class="val" x="680" y="186">216.0 MiB</text>

  <text class="lbl" x="404" y="220">OpenCode</text>
  <rect class="track" x="496" y="208" width="176" height="16" rx="4"/>
  <rect class="bar" x="496" y="208" width="176" height="16" rx="4"/>
  <text class="val" x="680" y="220">528.7 MiB</text>

  <text class="sub" x="404" y="252">21× lower RAM than Claude Code · 13 MB single binary</text>
</svg>
